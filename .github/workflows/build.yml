name: Build MAUI Apps

on:
    push:
        branches:
            - "release/*"

jobs:
    build:
        runs-on: macos-14

        env:
            BUILD_TIMESTAMP: ${{ github.run_id }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.100"

            - name: Install MAUI workloads
              run: |
                  dotnet workload install maui
                  dotnet workload install maui-android
                  dotnet workload install maui-ios

            - name: Build all apps
              run: |
                  mkdir -p build-${BUILD_TIMESTAMP}
                  # ClassLibrary and TemplateProject are excluded by omitting them from this list
                  apps=("ClientC")

                  # Extract version from branch name (e.g. release/1.2.2 -> 1.2.2)
                  BRANCH_NAME="${{ github.ref_name }}"
                  VER=${BRANCH_NAME#release/}
                  
                  echo "Detected Version: $VER from branch $BRANCH_NAME"
                  echo "VERSION=$VER" >> $GITHUB_ENV
                  
                  # Simple version code generation: remove dots
                  CODE=$(echo $VER | tr -d '.')
                  echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

                  for app in "${apps[@]}"; do
                    echo "Building $app with Version $VER (Code: $CODE)"
                    
                    echo "Restore"
                    dotnet restore $app

                    # Android
                    echo "Building Android APK..."
                    mkdir -p build-${BUILD_TIMESTAMP}/${app}/Android
                    dotnet publish $app -f net9.0-android -c Debug -p:AndroidPackageFormat=apk -p:ApplicationDisplayVersion=$VER -p:ApplicationVersion=$CODE
                    cp $app/bin/**/net9.0-android/**/*.apk build-${BUILD_TIMESTAMP}/${app}/Android/ || true

                  done

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ env.BUILD_TIMESTAMP }}
                  path: build-${{ env.BUILD_TIMESTAMP }}
